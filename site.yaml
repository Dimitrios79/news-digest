sponsor:
  label_el: ""             # π.χ. "Χορηγός σήμερα"
  label_en: ""
  text_el: ""
  text_en: ""
  url: ""

# 3) Google AdSense — βάλε το ca-pub-XXXXXXXXXXXXXXXX όταν εγκριθείς.
#    Παράγει αυτόματα ads.txt και θέσεις ανάμεσα στις ενότητες.
#    ΠΡΙΝ το ενεργοποιήσεις: στο AdSense → Privacy & messaging → ενεργοποίησε το
#    «European regulations message» (δωρεάν πιστοποιημένο παράθυρο συναίνεσης της
#    Google). Χωρίς αυτό οι διαφημίσεις στην ΕΕ παραβιάζουν GDPR/ePrivacy.
adsense_client: ""
adsense_slot: ""           # προαιρετικό: συγκεκριμένο ad unit

# 4) Δωρεές (Ko-fi / Buy Me a Coffee / GitHub Sponsors)
