<aside class="ad" aria-label="{{ ui.ad }}">
  <span class="ad-label">{{ ui.ad }}</span>
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ site.adsense_client }}"
       {% if site.adsense_slot %}data-ad-slot="{{ site.adsense_slot }}"{% endif %}
       data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</aside>
