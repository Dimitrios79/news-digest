author: "Daily Brief"
# ΣΗΜΑΝΤΙΚΟ: βάλε ένα email. Ενεργοποιεί το «Αναφορά λάθους» σε κάθε είδηση και
# εμφανίζεται στους όρους — είναι η βασική σου προστασία για λάθη του AI και
# απαιτείται από το AdSense. Πρόταση: ένα ξεχωριστό alias, όχι το προσωπικό σου.
contact_email: "panoptesscan@gmail.com"

# ── Έσοδα ─────────────────────────────────────────────────────────────
# 1) Newsletter — το πιο αποδοτικό κανάλι για digest. Buttondown/Beehiiv/
#    Substack δίνουν ένα URL φόρμας. Π.χ. https://buttondown.com/api/emails/embed-subscribe/USERNAME
