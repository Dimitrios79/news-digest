# Ρυθμίσεις site & έσοδα. Ό,τι μείνει κενό απλώς δεν εμφανίζεται.

name: "Daily Brief"
tagline_el: "Οι ειδήσεις της ημέρας, χωρίς σχόλια."
tagline_en: "Today's news, without the spin."
# Το τελικό URL του site (χωρίς / στο τέλος). Για GitHub Pages:
#   https://<username>.github.io/<repo>   ή το δικό σου domain.
