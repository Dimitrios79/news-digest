# Πηγές ειδήσεων ανά κατηγορία.
# Κάθε κατηγορία βγαίνει ως ξεχωριστή ενότητα στο ημερήσιο digest.
#
# ΜΟΝΟ άμεσα feeds εκδοτών — όχι Google News ή άλλους aggregators, γιατί
# οι όροι τους απαγορεύουν την εμπορική χρήση.
#
# Ισορροπία: σε κάθε χώρα υπάρχουν πηγές από διαφορετικούς εκδότες και
# διαφορετικούς πολιτικούς χώρους (δημόσιος φορέας, κεντροδεξιά, κεντροαριστερά,
# οικονομικός τύπος), ώστε το AI να βλέπει κάθε γεγονός από πολλές πλευρές.
#
# Feeds που αποτυγχάνουν απλώς παραλείπονται. Η αναφορά ανά feed φαίνεται
# στο log του workflow και στο data/raw/<ημερομηνία>.json.

categories:
  security:
    title_el: "Κυβερνοασφάλεια & AI Security"
    title_en: "Cybersecurity & AI Security"
    max_items: 12
    feeds:
      - https://feeds.feedburner.com/TheHackersNews
      - https://www.bleepingcomputer.com/feed/
      - https://krebsonsecurity.com/feed/
      - https://www.securityweek.com/feed/
      - https://therecord.media/feed
      - https://www.darkreading.com/rss.xml
      - https://www.helpnetsecurity.com/feed/
      - https://www.infosecurity-magazine.com/rss/news/
      - https://www.schneier.com/feed/atom/

  tech:
    title_el: "Τεχνολογία"
    title_en: "Technology"
    max_items: 10
    feeds:
      - https://feeds.arstechnica.com/arstechnica/index
      - https://www.theregister.com/headlines.atom
      - https://www.technologyreview.com/feed/
      - https://hnrss.org/frontpage?points=300

  greece:
    title_el: "Ελλάδα"
    title_en: "Greece"
    max_items: 10
    feeds:
      - https://www.ertnews.gr/feed/                     # ΕΡΤ (δημόσιος φορέας)
      - https://feeds.feedburner.com/kathimerini/DJpy    # Καθημερινή
      - https://www.tovima.gr/feed/                      # Το Βήμα
      - https://www.efsyn.gr/feed.xml                    # ΕφΣυν
      - https://www.naftemporiki.gr/feed/                # Ναυτεμπορική (οικονομικά)

  bulgaria:
    title_el: "Βουλγαρία"
    title_en: "Bulgaria"
    max_items: 10
    feeds:
      - https://www.bta.bg/bg/rss/free                   # БТА (κρατικό πρακτορείο)
      - https://bnr.bg/en/rss/news                       # БНР / Radio Bulgaria
      - https://www.dnevnik.bg/rss/                      # Дневник
      - https://www.capital.bg/rss/                      # Капитал
      - https://www.mediapool.bg/rss                     # Mediapool
      - https://www.novinite.com/services/news_rdf.php   # Novinite (EN)
      - https://feeds.feedburner.com/TheSofiaGlobe       # The Sofia Globe (EN)
