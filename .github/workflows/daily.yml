name: Daily brief

on:
  schedule:
    # 04:47 UTC = 07:47 ώρα Σόφιας/Αθήνας (θερινή). Λίγο πριν την ώρα,
    # γιατί τα crons στο :00 του GitHub συχνά καθυστερούν.
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Νέο digest για σήμερα (fetch + AI)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["templates/**", "static/**", "site.yaml", "scripts/build.py"]

permissions:
  contents: write
  pages: write
  id-token: write
  models: read      # δωρεάν GitHub Models μέσω του GITHUB_TOKEN

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.digest.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch & write digest
        id: digest
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.regenerate)
        env:
          # Αν υπάρχει secret ANTHROPIC_API_KEY χρησιμοποιείται το Claude,
          # αλλιώς το δωρεάν GitHub Models.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL }}
          PYTHONUNBUFFERED: "1"   # σωστή σειρά/χρόνοι στο log
        run: |
          python scripts/fetch.py
          python scripts/digest.py
          # κρατάμε μόνο 14 μέρες raw δεδομένων
          find data/raw -name '*.json' -mtime +14 -delete || true

      - name: Commit content
        if: steps.digest.outcome == 'success'
        run: |
          git config user.name  "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content data
          git diff --cached --quiet || git commit -m "Brief $(date -u +%F)"
          git push

      - name: Build site
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Το email φεύγει μόνο αφού το site είναι live, ώστε τα links να δουλεύουν.
  newsletter:
    needs: [build, deploy]
    if: needs.build.outputs.fresh == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML Jinja2
      - env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_LANG: ${{ vars.NEWSLETTER_LANG || 'el' }}
        run: python scripts/newsletter.py
